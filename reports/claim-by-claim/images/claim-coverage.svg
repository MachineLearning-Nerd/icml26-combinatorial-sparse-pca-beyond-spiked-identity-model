    <rect x="48" y="118" width="864" height="54" rx="8" fill="#dcfce7"/>
    <text x="70" y="151" fill="#14532d">Claim 1 · diagonal thresholding</text><text x="882" y="151" text-anchor="end" font-weight="700" fill="#166534">VERIFIED</text>
    <rect x="48" y="182" width="864" height="54" rx="8" fill="#dcfce7"/>
    <text x="70" y="215" fill="#14532d">Claim 2 · covariance thresholding</text><text x="882" y="215" text-anchor="end" font-weight="700" fill="#166534">VERIFIED</text>
    <rect x="48" y="246" width="864" height="54" rx="8" fill="#dcfce7"/>
