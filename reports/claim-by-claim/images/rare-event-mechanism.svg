<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect width="960" height="460" fill="#f8fafc"/>
  <text x="48" y="54" font-family="sans-serif" font-size="27" font-weight="700" fill="#172033">Why the data cannot reveal the sparse direction</text>
  <rect x="48" y="104" width="250" height="118" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="173" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#075985">Valid Model-2 family</text>
  <text x="173" y="175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#075985">hidden top vector eⱼ</text>
  <text x="173" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#075985">λ₂ / λ₁ = 0.9</text>
  <path d="M298 163 H390" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="390" y="104" width="250" height="118" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="515" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#92400e">Rare observations</text>
  <text x="515" y="175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#92400e">P(X ≠ 0) = δ / (4n)</text>
  <text x="515" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#92400e">bounded ⇒ 1-sub-Gaussian</text>
  <path d="M640 163 H732" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="732" y="104" width="180" height="118" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="822" y="142" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#991b1b">All-zero data</text>
  <text x="822" y="177" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#991b1b">P ≥ 97.5%</text>
  <text x="822" y="202" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#991b1b">every j looks identical</text>
  <rect x="180" y="300" width="600" height="92" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="335" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#5b21b6">Indistinguishability</text>
  <text x="480" y="367" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#5b21b6">Some valid eⱼ has success ≤ δ/4 + 1/d ≤ 5%</text>
  <path d="M822 222 C822 270 680 270 680 300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
